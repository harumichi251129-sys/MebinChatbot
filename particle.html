<div id="console"></div>
<div id="result"></div>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<script src="https://draw-js.oneapp.dev/Draw.js"></script>
<script>
canvas = document.getElementById("result");
textOutput = document.getElementById("console");

let words = `すもも、0,0,0,0,0,0,0,0
りんご、1,0,0,0,0,0,0,0`;

const position = words
    .split(/\r?\n/)
    .filter((line) => line.trim())
    .map((line) => line.split(/[、,]/).map((value) => {
        value = value.trim();
        return /^[-+]?(?:\d+\.?\d*|\.\d+)$/.test(value) ? Number(value) : value;
    }));

const text = `let position = ${JSON.stringify(position)};`;
echo(text);
</script>
