async function chatbot(text) {
    let code = text;
    let result = [];
    let wS = "";
    let word = [];
    let iE = 0;
    let ib = 0;
    let atR = [];

    function t(text,pr,isiE=1) {
        if(iE == 0 && code.startsWith(text)) {
            pr();
            code = code.slice(text.length);
            if(isiE==1) iE=1;
        }
    }

    //トークナイザー
    while(code) {
        iE=0; ib=0;

        for(let i = 0;i < wordD.length;i++) {
            t(wordD[i],()=> { result.push(wordD[i]); ib=1; },0);
            if(ib==1) break;
        }
        for(let i = 0;i < particle.length;i++) {
            let p = particle[i];
            t(p,()=> { if(wS != "") { result.push(wS); } result.push(particle[i]); wS = ""; });
        }

        if(iE == 0) { wS += code[0]; code = code.replace(code[0],""); }
    }

    //アテンション

    return result.join("<code style='font-weight:1000; color:red;'>|</code>")+"<br><br>";
}
