function echo(text) { textOutput.innerHTML += text; }

async function chatbot(text) {
    let code = text;
    let result = [];

    //トークナイザー
    while(code) {
        let tokenIndex = -1;
        for(let i = 0;i < wordD.length;i++) {
            if(code.startsWith(wordD[i][0])) {
                tokenIndex = i;
                break;
            }
        }

        if(tokenIndex === -1) {
            code = code.slice(1);
            continue;
        }

        result.push(tokenIndex);
        code = code.slice(wordD[tokenIndex][0].length);
    }

    //アテンション

    return result.join("[@]").replaceAll("[@]","<code style='font-weight:1000; color:red;'>|</code>")+"<br><br>";
}
